<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Coin Detection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #4CAF50;
        }
        .video-container {
            border: 4px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>🪙 Thai Coin Detection AI</h1>
    <p>Real-time detection and total sum calculation of Thai coins (10, 5, 2, 1, 0.50 Baht)</p>
    
    <div class="video-container">
        <!-- The image source points to the Flask video feed route -->
        <img src="{{ url_for('video_feed') }}" alt="Video Stream">
    </div>

    <div class="footer">
        Powered by YOLOv5 and Flask
    </div>
</body>
</html>
